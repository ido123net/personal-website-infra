[project]
name = "personal-website-infra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ansible-core>=2.20,<2.22",
    "pre-commit>=4.7.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "yamllint>=1.38.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
