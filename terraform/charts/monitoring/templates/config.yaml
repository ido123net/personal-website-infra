apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: higayon
        dns_sd_configs:
          - names: ['higayon-metrics.{{ .Release.Namespace }}.svc.cluster.local']
            type: A
            port: 9091
            refresh_interval: 15s
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: higayon-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Higayon
        type: file
        folder: Higayon
        updateIntervalSeconds: 30
        options:
          path: /var/lib/higayon-dashboards
