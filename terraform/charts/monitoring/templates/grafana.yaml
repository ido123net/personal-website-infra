apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.grafanaImage }}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}}
          resources:
            requests: {cpu: 30m, memory: 96Mi}
            limits: {memory: 384Mi}
          env:
            - {name: GF_SERVER_ROOT_URL, value: {{ ternary (printf "https://%s/" .Values.hostname) "http://localhost:3300/" .Values.publicIngress | quote }}}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_GOOGLE_ENABLED, value: "true"}
            - {name: GF_AUTH_GOOGLE_ALLOW_SIGN_UP, value: "true"}
            - {name: GF_AUTH_GOOGLE_SCOPES, value: "openid email profile"}
            - {name: GF_AUTH_GOOGLE_VALIDATE_ID_TOKEN, value: "true"}
            - {name: GF_AUTH_GOOGLE_JWK_SET_URL, value: "https://www.googleapis.com/oauth2/v3/certs"}
            - {name: GF_AUTH_GOOGLE_SKIP_ORG_ROLE_SYNC, value: "false"}
            - {name: GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_STRICT, value: "true"}
            - name: GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH
              value: {{ printf "email == '%s' && email_verified == `true` && 'Admin'" (required "ownerEmail is required" .Values.ownerEmail) | quote }}
            - name: GF_AUTH_GOOGLE_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: GOOGLE_CLIENT_ID}}
            - name: GF_AUTH_GOOGLE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.runtimeSecret }}, key: GOOGLE_CLIENT_SECRET}}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/higayon-dashboards, readOnly: true}
      volumes:
        - name: datasources
          configMap: {name: monitoring-config, items: [{key: datasource.yaml, path: datasource.yaml}]}
        - name: providers
          configMap: {name: monitoring-config, items: [{key: dashboards.yaml, path: dashboards.yaml}]}
        - name: dashboards
          configMap: {name: higayon-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
{{- if .Values.publicIngress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.hostname }}]
      secretName: grafana-tls
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: grafana, port: {number: 3000}}
{{- end }}
