{{- range $environment, $url := dict "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "production" "https://acme-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-{{ $environment }}
spec:
  acme:
    email: {{ required "acmeEmail is required" $.Values.acmeEmail | quote }}
    server: {{ $url | quote }}
    privateKeySecretRef:
      name: letsencrypt-{{ $environment }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $.Values.ingressClass | quote }}
{{- end }}
